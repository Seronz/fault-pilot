# Konfigurasi Fault Pilot.
#
# executor.type menentukan jenis eksekutor remediation:
#   lab       - POST /control ke Fault Injector (default, dummy; aman untuk uji)
#   systemctl - systemctl restart <service>
#   kubectl   - kubectl rollout restart deployment/<name> -n <ns>
#   aws_ec2   - reboot instance EC2 (butuh EC2API)
#   ansible   - ansible-playbook <runbook> -l <target>
executor:
  type: lab
  allowlist:
    targets:
      - checkout
    runbooks:
      - runbooks/restart.yml
  fault_injector_url: http://localhost:8081/control

# Observability untuk Fault Pilot sendiri.
observability:
  metrics_addr: ":9090"      # GET /metrics, /healthz, /readyz
  store_path: "faultpilot.db" # SQLite untuk deep health check
  last_poll_max: "2m"        # /healthz gagal bila poll terakhir lebih lama dari ini

# RBAC & Human Approval Gate. Aksi berisiko tinggi wajib disetujui manusia.
approval:
  enabled: true
  addr: ":8082"              # HTTP API approval (GET/POST /approvals)
  rbac_path: "config/rbac.yaml"
  require_risks: [high]      # risk yang wajib approval manusia
  ttl: "15m"                 # masa berlaku sebuah approval
